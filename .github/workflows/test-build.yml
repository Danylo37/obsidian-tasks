name: Test Build
on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'yarn'

    - name: Set test version
      id: version
      run: |
        version=$(node -p "require('./manifest.json').version")-autocomplete.${{ github.run_number }}
        node -e "const fs = require('fs'); const m = require('./manifest.json'); m.version = '$version'; fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Build
      run: |
        yarn --frozen-lockfile
        yarn run build

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.version.outputs.version }}
        body: Test build of ${{ github.ref_name }} at ${{ github.sha }}.
        make_latest: true
        files: |
          main.js
          manifest.json
          styles.css
